project:
  type: book
  output-dir: docs

book:
  twitter-card: true
  title: "**Pointblank**: The Complete Guide to Data Validation in Python"
  author: "Richard Iannone"
  search: true
  repo-url: https://github.com/rich-iannone/pointblank-the-complete-guide
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01-intro.qmd
        - 02-getting-started.qmd
        - 03-inspecting-data.qmd
        - 04-validation-workflow.qmd
        - 05-analysis-loop.qmd
    - part: "Building Validation Plans"
      chapters:
        - 06-column-validations.qmd
        - 07-aggregate-validations.qmd
        - 08-row-validations.qmd
        - 09-table-validations.qmd
        - 10-missing-data.qmd
        - 11-segmented-validation.qmd
        - 12-advanced-validation.qmd
    - part: "Responding to Results"
      chapters:
        - 13-thresholds-actions.qmd
        - 14-reports-extracts.qmd
        - 15-quality-scoring.qmd
        - 16-notifications-observability.qmd
    - part: "AI-Assisted Validation"
      chapters:
        - 17-semantic-validation.qmd
        - 18-ai-authoring.qmd
    - part: "Data Sources, Interfaces & Automation"
      chapters:
        - 19-data-sources.qmd
        - 20-yaml-workflows.qmd
        - 21-command-line.qmd
        - 22-mcp-server.qmd
    - part: "Data Contracts & Pipelines"
      chapters:
        - 23-data-contracts.qmd
        - 24-pipelines.qmd
    - part: "Test Data Generation"
      chapters:
        - 25-test-data-generation.qmd
    - part: "Clinical & Regulated Data"
      chapters:
        - 26-clinical-cdisc.qmd
        - 27-cdisc-conformance.qmd
    - part: "Industry Playbooks"
      chapters:
        - 28-playbook-financial.qmd
        - 29-playbook-ecommerce.qmd
        - 30-playbook-data-engineering.qmd
        - 31-playbook-healthcare.qmd
        - 32-playbook-rwe.qmd
        - 33-playbook-ml-monitoring.qmd
        - 34-playbook-iot-sensors.qmd
        - 35-playbook-insurance.qmd
        - 36-playbook-public-sector.qmd
        - 37-playbook-marketing.qmd
  appendices:
    - appendix-reference.qmd

format:
  html:
    toc: true
    toc-depth: 2
    code-link: true
    code-line-numbers: false
    code-annotations: below
    css: custom.css

execute:
  collapse: true

# Pointblank validation reports are Great Tables HTML tables, so, disable Quarto's
# default HTML table post-processing so they render intact.
html-table-processing: none
